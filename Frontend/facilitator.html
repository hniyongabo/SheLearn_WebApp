<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilitator Dashboard | SheLearn</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body style="background-color: #fcfcfc; display: block;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 40px;">
        <header class="page-header">
            <div>
                <h2 style="color: #333;">Facilitator Panel</h2>
                <p style="color: #777;">Managing: Data Science and Engineering Track</p>
            </div>
            <button class="btn-primary-small">+ Upload New Material</button>
        </header>

        <section class="table-section">
            <h4 style="margin-bottom: 20px;">Recent Submissions</h4>
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Module</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Harmony Naomi</td>
                        <td>Week 2: Web Scraping</td>
                        <td><span class="badge-pending">Pending Grade</span></td>
                        <td><a href="#" style="color: #CB87E6; font-weight: 600;">Open File</a></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>

</html>
