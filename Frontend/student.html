<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | SheLearn</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="logo dashboard-logo">SheLearn</div>
            <nav>
                <a href="#" class="nav-item active">My Dashboard</a>
                <a href="#" class="nav-item">Course Modules</a>
                <a href="#" class="nav-item">Assignments</a>
                <a href="#" class="nav-item">Knowledge Test</a>
                <!-- Logout uses a dedicated class so it can be styled as a "danger" action without inline styles. -->
                <a href="landing.html" class="nav-item nav-item-logout">Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <h2>Welcome Back, Scholar!</h2>
                <p class="dashboard-subtitle">Track: Data Science &amp; Analysis</p>
            </header>

            <div class="card-grid">
                <div class="course-card">
                    <h4 class="dashboard-card-title">Current Module</h4>
                    <p style="font-size: 14px; margin-bottom: 20px;">Introduction to SQL Queries & Database Management
                    </p>
                    <button class="btn-accent">Continue Learning</button>
                </div>
                <div class="course-card">
                    <h4 class="dashboard-card-title">Next Assignment</h4>
                    <p style="font-size: 14px; margin-bottom: 20px;">SQL Murder Mystery - Submission due in 2 days.</p>
                    <button class="btn-secondary">View Instructions</button>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
