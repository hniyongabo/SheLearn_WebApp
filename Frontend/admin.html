<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SheLearn</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dashboard-page">
    <div class="page-container page-container-tight">
        <!-- Keep admin title readable (black) while preserving global .logo brand styling elsewhere. -->
        <div class="dashboard-branding" style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px;">
            <div class="logo" style="margin-bottom: 0;">SheLearn</div>
            <h2 style="color: #35B7A2; margin-bottom: 0;">Admin Dashboard</h2>
        </div>

        <section class="stats-container">
            <!-- Stat cards use shared .stat-box styles so visual system stays consistent across dashboards. -->
            <div class="stat-box">
                <span class="stat-number">85</span>
                <p>Total Students</p>
            </div>
            <!-- Alternate stat background kept within brand palette (no inline styles). -->
            <div class="stat-box stat-box-alt">
                <span class="stat-number">4</span>
                <p>Facilitators</p>
            </div>
            <!-- Outline variant improves contrast for "neutral" stats while reusing layout/spacing from .stat-box. -->
            <div class="stat-box stat-box-outline">
                <span class="stat-number">92%</span>
                <p>Platform Progress</p>
            </div>
        </section>

        <!-- Analytics Chart Panel -->
        <!-- Utility spacing class replaces inline margin for maintainability. -->
        <div class="panel mb-30">
            <h4 class="panel-title">Analytics: User Time on Platform</h4>
            <!-- Chart wrapper class replaces inline sizing; keeps layout consistent across pages. -->
            <div class="chart-wrapper">
                <canvas id="userTimeChart"></canvas>
            </div>
        </div>

        <!-- User Management Panel -->
        <div class="panel">
            <!-- Header spacing moved to CSS so future adjustments don't require editing HTML. -->
            <div class="page-header mb-20">
                <h4 class="panel-title mb-0">User Management</h4>
                <div class="panel-actions">
                    <button class="btn-primary-small btn-dark">+ Add User</button>
                    <button class="btn-secondary btn-secondary-compact">Generate Report</button>
                </div>
            </div>

            <!-- Horizontal scroll is a shared class so tables stay usable on small screens. -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Mugisha Anne</td>
                            <td>annemu@gmail.com</td>
                            <td>Student</td>
                            <td><span class="badge-active">Active</span></td>
                            <td class="table-actions">
                                <button class="btn-action btn-update">Update</button>
                                <button class="btn-action btn-delete">Delete</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Kankindi Tianne</td>
                            <td>kankindit@gmail.com</td>
                            <td>Facilitator</td>
                            <td><span class="badge-active">Active</span></td>
                            <td class="table-actions">
                                <button class="btn-action btn-update">Update</button>
                                <button class="btn-action btn-delete">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Main scripts -->
    <script src="script.js"></script>
</body>

</html>
