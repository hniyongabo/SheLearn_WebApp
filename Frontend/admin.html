<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SheLearn</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body class="dashboard-page">
    <div class="page-container page-container-tight">
        <div class="logo page-logo">SheLearn Admin</div>

        <section class="stats-container">
            <div class="stat-box">
                <span class="stat-number">85</span>
                <p>Total Students</p>
            </div>
            <div class="stat-box stat-box-alt">
                <span class="stat-number">4</span>
                <p>Facilitators</p>
            </div>
            <div class="stat-box stat-box-outline">
                <span class="stat-number">92%</span>
                <p>Platform Progress</p>
            </div>
        </section>

        <div class="panel">
            <h4 class="panel-title">User Management</h4>
            <div class="panel-actions">
                <button class="btn-primary-small">Add User</button>
                <button class="btn-primary-small">Update User</button>
                <button class="btn-primary-small">Delete User</button>
                <button class="btn-secondary btn-secondary-compact">Generate Report</button>
            </div>
        </div>
    </div>
</body>

</html>
