<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | SheLearn</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body style="background-color: #fafafa; display: block;">
    <div style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
        <div class="logo" style="margin-bottom: 30px;">SheLearn Admin</div>

        <section class="stats-container">
            <div class="stat-box">
                <span class="stat-number">85</span>
                <p>Total Students</p>
            </div>
            <div class="stat-box" style="background: #4A3B52;">
                <span class="stat-number">4</span>
                <p>Facilitators</p>
            </div>
            <div class="stat-box" style="background: #ffffff; color: #333; border: 2px solid #FBE9FB;">
                <span class="stat-number">92%</span>
                <p>Platform Progress</p>
            </div>
        </section>

        <div style="background: white; padding: 30px; border-radius: 20px; border: 1px solid #FBE9FB;">
            <h4 style="margin-bottom: 20px;">User Management</h4>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary-small">Add User</button>
                <button class="btn-secondary" style="padding: 10px 20px;">Generate Report</button>
            </div>
        </div>
    </div>
</body>

</html>
